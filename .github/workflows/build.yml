name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: "Image folder to build (blank = all)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - id: select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image }}" ]; then
            imgs=$(jq -cn --arg i "${{ inputs.image }}" '[$i]')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            # dispatch-all, or first commit (no parent): build every image folder
            imgs=$(find . -maxdepth 2 -name Dockerfile -printf '%h\n' | sed 's|^\./||' | jq -R . | jq -cs .)
          else
            changed=$(git diff --name-only HEAD^ HEAD | grep -oE '^[^/]+/' | sort -u | sed 's|/$||')
            imgs="[]"
            for d in $changed; do
              [ -f "$d/Dockerfile" ] && imgs=$(printf '%s' "$imgs" | jq -c --arg d "$d" '. + [$d]')
            done
          fi
          echo "images=$imgs" >> "$GITHUB_OUTPUT"
          echo "Selected images: $imgs"

  build:
    needs: detect
    if: needs.detect.outputs.images != '[]' && needs.detect.outputs.images != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/polarn/${{ matrix.image }}:latest
            ghcr.io/polarn/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/polarn/container-images

      - run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin in flux: \`ghcr.io/polarn/${{ matrix.image }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
